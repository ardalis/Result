name: .NET Core

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    # Write permission needed to add PR comment
    permissions:
      pull-requests: write

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v3
      with:
          dotnet-version: |
            6.0.x
            8.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore

      # See https://josh-ops.com/posts/github-code-coverage/
      # Add coverlet.collector nuget package to test project - 'dotnet add <TestProject.cspoj> package coverlet
    # .NET Framework (net48) tests can't run on Linux: the .NET 11 SDK dropped Mono support.
    # They run in the net48 job below on Windows instead.
    - name: Test (net6.0)
      run: dotnet test --no-restore --framework net6.0 --verbosity normal --collect:"XPlat Code Coverage" --logger trx --results-directory coverage

    - name: Test (net8.0)
      run: dotnet test --no-restore --framework net8.0 --verbosity normal --collect:"XPlat Code Coverage" --logger trx --results-directory coverage

    - name: Copy Coverage To Predictable Location
      # run: cp coverage/*/coverage.cobertura.xml coverage/coverage.cobertura.xml
      run: find coverage -type f -name coverage.cobertura.xml -exec cp -p {} coverage/coverage.cobertura.xml \;

    - name: Code Coverage Summary Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      # uses: joshjohanning/CodeCoverageSummary@v1.0.2
      with:
        filename: coverage/coverage.cobertura.xml
        badge: true
        format: 'markdown'
        output: 'both'

    - name: Upload code coverage results artifact
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: code-coverage-results
        path: code-coverage-results.md
        retention-days: 1

    - name: Save the PR number in an artifact
      if: github.event_name == 'pull_request' && (success() || failure())
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.number }}
      run: echo $PR_NUMBER > pr-number.txt

    - name: Upload the PR number
      uses: actions/upload-artifact@v4
      if: github.event_name == 'pull_request' &&  (success() || failure())
      with:
        name: pr-number
        path: ./pr-number.txt
        retention-days: 1

  # Verifies the core library stays usable from .NET Framework 4.8.
  net48:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
    # One step per project: a multi-line PowerShell step only fails on the last command's exit code.
    - name: Test Ardalis.Result.Sample.UnitTests (net48)
      run: dotnet test sample/Ardalis.Result.Sample.UnitTests/Ardalis.Result.Sample.UnitTests.csproj --framework net48 --configuration Release --verbosity normal
    - name: Test Ardalis.Result.UnitTests (net48)
      run: dotnet test tests/Ardalis.Result.UnitTests/Ardalis.Result.UnitTests.csproj --framework net48 --configuration Release --verbosity normal
    - name: Test Ardalis.Result.FluentAssertions.UnitTests (net48)
      run: dotnet test tests/Ardalis.Result.FluentAssertions.UnitTests/Ardalis.Result.FluentAssertions.UnitTests.csproj --framework net48 --configuration Release --verbosity normal
    - name: Test Ardalis.Result.Shouldly.UnitTests (net48)
      run: dotnet test tests/Ardalis.Result.Shouldly.UnitTests/Ardalis.Result.Shouldly.UnitTests.csproj --framework net48 --configuration Release --verbosity normal
